# ViKnow 3 开发专用数据栈（与 viknow2-test 的 15432/16379/17687 隔离）
# 启动：docker compose -f deploy/viknow3-dev-data/docker-compose.yml up -d
# Postgres 业务库 + viknow3_ops 使用已有 viknow3-ops-postgres（127.0.0.1:16432），不在此 compose 内。登录角色仍是 viknow_ops。

services:
  redis:
    image: redis:7-alpine
    container_name: viknow3-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "viknow3dev"]
    ports:
      - "127.0.0.1:16479:6379"

  neo4j:
    image: neo4j:5.26-community
    container_name: viknow3-dev-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/viknow3dev
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "127.0.0.1:17487:7687"
