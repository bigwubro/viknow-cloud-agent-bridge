<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>算法自测 · 上传与建索引</title>
  <link rel="stylesheet" href="/assets/algorithm.css">
</head>
<body>
  <main>
    <h1>算法自测</h1>
    <p class="lead">先上传源文件。上传完成后，再手动建索引。这一页只通过 ViKnow SDK 调用接入层。</p>

    <section>
      <h2>1. 上传</h2>
      <label>库 ID <input id="library" value="library-1" autocomplete="off"></label>
      <label>文件 <input id="file" type="file"></label>
      <button id="upload" type="button">上传</button>
      <pre id="uploaded" class="out"></pre>
    </section>

    <section>
      <h2>2. 建索引</h2>
      <label>编译模式
        <select id="mode">
          <option value="">默认</option>
          <option value="fast_ingest">fast_ingest</option>
          <option value="pre_compile">pre_compile</option>
        </select>
      </label>
      <button id="index" type="button" disabled>建索引</button>
      <button id="refresh" type="button" disabled>刷新状态</button>
      <pre id="job" class="out"></pre>
    </section>
  </main>
  <script src="/assets/algorithm.js"></script>
</body>
</html>
