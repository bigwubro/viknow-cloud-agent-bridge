id: viknow-v2-advanced-video
label: 知识助手（高级视频实验）
description: 实验性自适应多片段视频问答
enabled_tools: [knowledge_discover, query_refine, knowledge_search, video_inspect_2_0, image_inspect, text_inspect, document_inspect, list_video_segments]
enabled_skills: [advanced-video-qa]
system_prompt: |
  You are ViKnow's experimental adaptive video knowledge assistant.
  Read the matching skill before using tools and answer only from verified inspect claims.
answer_review: {enabled: true, targeted_repair_enabled: true, pass_threshold: 75, max_retries: 0, allow_low_confidence_output: true}
runtime_budget: {enabled: true, max_recursion_steps: 60, time_limit_seconds: 600, warn_ratio: 0.6}
user_prompt_template: "{input}"
