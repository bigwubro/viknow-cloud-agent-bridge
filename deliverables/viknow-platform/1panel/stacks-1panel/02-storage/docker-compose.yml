# 1Panel 栈 02：viknow-storage + 内网 MinIO（浏览器不直连 MinIO）

name: viknow-platform-storage

services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: viknow-platform-storage-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: viknow-storage
      MINIO_ROOT_PASSWORD: ${VIKNOW_STORAGE_MINIO_PASSWORD:?set VIKNOW_STORAGE_MINIO_PASSWORD}
    volumes:
      - ${VIKNOW_STORAGE_MINIO_DATA:-./data/minio}:/data
    expose:
      - "9000"
    networks:
      - viknow_platform

  storage:
    image: ${VIKNOW_STORAGE_IMAGE:?set VIKNOW_STORAGE_IMAGE}
    container_name: viknow-platform-storage
    restart: unless-stopped
    depends_on:
      - minio
    environment:
      STORAGE_TOKEN: ${STORAGE_TOKEN:?set STORAGE_TOKEN}
      STORAGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-viknow_ops}:${POSTGRES_PASSWORD}@postgres:5432/viknow_storage
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: viknow-storage
      S3_SECRET_KEY: ${VIKNOW_STORAGE_MINIO_PASSWORD}
      S3_BUCKET: viknow
      S3_REGION: us-east-1
      STORAGE_CORS_ORIGINS: ${STORAGE_CORS_ORIGINS:?set STORAGE_CORS_ORIGINS e.g. http://192.168.1.10:5198}
      STORAGE_GRANT_SECRET: ${STORAGE_GRANT_SECRET:-}
      STORAGE_DOWNLOAD_BASE_URL: ${STORAGE_DOWNLOAD_BASE_URL:-http://storage:8080}
      STORAGE_GRANT_TTL_SECONDS: ${STORAGE_GRANT_TTL_SECONDS:-86400}
    ports:
      - "${VIKNOW_STORAGE_HTTP_PORT:-5219}:8080"
    networks:
      - viknow_platform

networks:
  viknow_platform:
    external: true
    name: ${VIKNOW_PLATFORM_NETWORK:-viknow-platform_data}
