name: Setup Cloudflare tunnel for 236

on:
  workflow_dispatch:
    inputs:
      action:
        description: "install | status | stop"
        required: false
        default: install

jobs:
  setup-cloudflared-tunnel:
    name: Expose 236 SSH via Cloudflare domain
    runs-on: python-312-uv

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            gitea-diagnostics/setup-cloudflared-tunnel.sh
          sparse-checkout-cone-mode: false

      - name: Install cloudflared on host (chroot)
        env:
          TUNNEL_ACTION: ${{ inputs.action }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x gitea-diagnostics/setup-cloudflared-tunnel.sh
          docker run --rm -i --privileged --pid=host --network=host \
            -v /:/host \
            -e TUNNEL_ACTION \
            -e CLOUDFLARE_TUNNEL_TOKEN \
            viknow/ci-python:3.12-uv-docker29.1.3 \
            bash -c 'chroot /host env TUNNEL_ACTION="${TUNNEL_ACTION}" CLOUDFLARE_TUNNEL_TOKEN="${CLOUDFLARE_TUNNEL_TOKEN}" bash -s' \
            < gitea-diagnostics/setup-cloudflared-tunnel.sh
