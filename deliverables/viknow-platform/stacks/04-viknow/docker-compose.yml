# ViKnow Platform — 应用栈（与 viknow2-jinhe 同构，网络名默认 viknow-platform_data）

services:
  viknow2:
    image: ${VIKNOW_IMAGE:-viknow2-app:56d8705e5feb}
    container_name: ${VIKNOW_CONTAINER_NAME:-viknow2-platform}
    restart: unless-stopped
    init: true
    privileged: true
    ports:
      - "${VIKNOW_HOST_PORT:-8000}:8000"
    env_file:
      - ./deploy.env
    environment:
      PORT: "8000"
      VIKNOW_CONFIG: /opt/viknow/config/jinhe/app.yaml
    volumes:
      - ${VIKNOW_DATA_DIR:-./data}:/data
      - viknow_platform_state:/opt/viknow/.state
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      - data

networks:
  data:
    external: true
    name: ${VIKNOW_DATA_NETWORK:?set VIKNOW_DATA_NETWORK in .env}

volumes:
  viknow_platform_state:
    name: ${VIKNOW_STATE_VOLUME:-viknow_platform_state}
