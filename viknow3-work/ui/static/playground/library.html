<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ViKnow Playground · 知识库详情</title>
    <link rel="stylesheet" href="/playground/assets/playground.css?v=10" />
  </head>
  <body class="pg-body">
    <div class="pg-shell">
      <aside class="pg-sidebar" aria-label="导航">
        <div class="pg-sidebar-head">
          <div class="pg-brand-mark">V</div>
          <div>
            <div class="pg-brand-title">ViKnow</div>
            <div class="pg-brand-sub">Playground</div>
          </div>
        </div>
        <nav class="pg-nav">
          <a class="pg-nav-item pg-nav-active" href="/playground/workspace">知识库</a>
          <a class="pg-nav-item" href="/playground/agents">智能体</a>
        </nav>
        <button id="btn-logout" class="pg-button-sidebar pg-sidebar-logout" type="button">退出登录</button>
      </aside>
      <main class="pg-main pg-workspace-fill">
        <div class="pg-main-inner">
          <header class="pg-header">
            <p class="pg-breadcrumb"><a href="/playground/workspace">知识库</a> / <span id="library-id-label"></span></p>
            <p class="pg-overline">Library</p>
            <h1 id="library-title">…</h1>
            <p class="pg-muted" id="library-meta"></p>
          </header>

          <section class="pg-card">
            <h2>上传与登记</h2>
            <div class="pg-card-body">
              <p class="pg-muted pg-help">流程：预签名 PUT → S3 → <code class="pg-mono">POST …/assets</code>。对象键示例 <code class="pg-mono">knowledge/assets/{id}/upload/…</code></p>
              <label class="pg-label" for="upload-file">选择文件</label>
              <input id="upload-file" class="pg-input" type="file" />
              <button id="btn-upload" class="pg-button pg-button-primary" type="button">上传并创建 Asset</button>
              <p id="upload-status" class="pg-muted" hidden></p>
              <p id="upload-error" class="pg-error" hidden></p>
            </div>
          </section>

          <section class="pg-card">
            <h2>资产</h2>
            <div class="pg-card-body">
              <p class="pg-muted pg-help">
                索引：
                <label class="pg-inline-label" for="index-compile-mode">compile_mode</label>
                <select id="index-compile-mode" class="pg-input pg-input-inline">
                  <option value="">默认</option>
                  <option value="fast_ingest">fast_ingest</option>
                  <option value="pre_compile">pre_compile</option>
                </select>
              </p>
              <div id="assets-loading" class="pg-muted">加载中…</div>
              <table id="asset-table" class="pg-table" hidden>
                <thead>
                  <tr>
                    <th>Asset ID</th>
                    <th>标题</th>
                    <th>路径</th>
                    <th>状态</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="asset-rows"></tbody>
              </table>
              <p id="asset-list-empty" class="pg-muted" hidden>尚无资产，请上传文件。</p>
            </div>
          </section>
        </div>
      </main>
    </div>
    <div id="index-progress-modal" class="pg-modal-backdrop" hidden>
      <div class="pg-modal" role="dialog" aria-labelledby="index-progress-title" aria-modal="true">
        <header class="pg-modal-head">
          <h2 id="index-progress-title">索引进度</h2>
          <button id="index-progress-close" class="pg-button pg-button-link" type="button">关闭</button>
        </header>
        <div class="pg-modal-body">
          <p id="index-progress-summary" class="pg-muted">…</p>
          <p id="index-progress-error" class="pg-error" hidden></p>
          <table class="pg-table pg-table-compact">
            <thead>
              <tr>
                <th>阶段</th>
                <th>状态</th>
                <th>错误</th>
              </tr>
            </thead>
            <tbody id="index-progress-tasks"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="/playground/assets/user.js?v=7"></script>
    <script src="/playground/assets/library.js?v=8"></script>
    <script>
      PlaygroundLibrary.requireUser();
      document.getElementById("btn-logout").addEventListener("click", () => {
        localStorage.removeItem("viknow_playground_user");
        window.location.href = "/playground";
      });
      PlaygroundLibrary.initLibraryDetailPage();
    </script>
  </body>
</html>
