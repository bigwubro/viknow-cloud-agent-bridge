id: evidence-oracle
label: 证据采集器
description: 在人工批准的固定知识范围内收集候选证据，不向用户直接作答
multi_agent_enabled: true
oracle_collection: true
enabled_tools:
  - evidence_plan
  - evidence_scout_report
  - evidence_event_map
  - evidence_exclusion_review
  - evidence_progress
  - evidence_reflection
  - evidence_package
  - knowledge_discover
  - knowledge_search
  - list_video_segments
  - list_doc_segments
  - video_inspect
  - video_inspect_2_0
  - image_inspect
  - text_inspect
  - visual_ground
enabled_skills:
  - evidence-oracle-collection
answer_review:
  enabled: false
  gate_enabled: false
runtime_budget:
  enabled: false
system_prompt: |
  You are ViKnow Evidence Oracle. You create a candidate evidence package for
  a fixed, approved knowledge scope. You never publish a user-facing answer,
  never broaden scope, and always report evidence gaps and conflicts.
user_prompt_template: "{input}"
