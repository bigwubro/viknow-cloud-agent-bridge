[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# 下面的配置是用于解决多线程异步测试时，event loop 冲突的问题
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# 标记
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers
    
# 异步测试超时
timeout = 300

# 覆盖率选项
[coverage:run]
source = src/hyperrag
omit = 
    */tests/*
    */test_*
    
[coverage:report]
precision = 2
show_missing = True
skip_covered = False
