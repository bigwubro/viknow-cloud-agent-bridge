# 236 手工冒烟：与客户 compose 相同（external data 网络，无 extra_hosts）。
# 与 docker-compose.yml 同目录；deploy.env 用 deploy.env.236 复制为 deploy.env。
# 外部 LLM 请在 deploy.env 里写容器路由可达的 IP/URL（如 http://10.x.x.x:4000/v1）。
#
# 前置：viknow-private-data 四件套已 up（network: viknow-private-data_appnet）

services:
  viknow2:
    image: ${VIKNOW_IMAGE:-viknow2-app:56d8705e5feb}
    container_name: ${VIKNOW_CONTAINER_NAME:-viknow2-jinhe-manual}
    restart: unless-stopped
    privileged: true
    ports:
      - "${VIKNOW_HOST_PORT:-8006}:8000"
    env_file:
      - ./deploy.env
    environment:
      PORT: "8000"
      VIKNOW_CONFIG: /opt/viknow/config/jinhe/app.yaml
    volumes:
      - ${VIKNOW_DATA_DIR:-./data}:/data
      - viknow_jinhe_state:/opt/viknow/.state
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      - data

networks:
  data:
    external: true
    name: ${VIKNOW_DATA_NETWORK:?set VIKNOW_DATA_NETWORK to your data stack network}

volumes:
  viknow_jinhe_state:
    name: ${VIKNOW_STATE_VOLUME:-viknow_jinhe_manual_state}
