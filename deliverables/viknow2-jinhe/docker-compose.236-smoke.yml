# 236 手工冒烟：监控用占位 URL，其余用内网 IP。
# 必须 extra_hosts：本机 JuiceFS 元数据里的 MinIO 桶是 host.docker.internal:19000
#（与 viknow2-test 共用同一卷）。应用层仍走 10.200.0.1，不要改成 IP 重 format。
#
# 前置：viknow-test-data 四件套已 up（10.200.0.1:15432/16379/19000/17687）

services:
  viknow2:
    image: ${VIKNOW_IMAGE:-viknow2-app:56d8705e5feb}
    container_name: ${VIKNOW_CONTAINER_NAME:-viknow2-jinhe-manual}
    restart: unless-stopped
    # JuiceFS 等子进程退出后需 init 回收，否则 docker rm/kill 可能卡在 zombie PID
    init: true
    privileged: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${VIKNOW_HOST_PORT:-8006}:8000"
    env_file:
      - ./deploy.env.236
    environment:
      PORT: "8000"
      VIKNOW_CONFIG: /opt/viknow/config/jinhe/app.yaml
    volumes:
      - ${VIKNOW_DATA_DIR:-./data}:/data
      - viknow_jinhe_state:/opt/viknow/.state
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

volumes:
  viknow_jinhe_state:
    name: ${VIKNOW_STATE_VOLUME:-viknow_jinhe_manual_state}
