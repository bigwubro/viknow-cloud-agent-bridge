# Copy to: castmeta-research/viknow2/.gitea/workflows/probe-relay-ssh.yml

name: Probe relay SSH paths from 236

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe SSH to gateway candidates
    runs-on: python-312-uv

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            gitea-diagnostics/probe-relay-ssh.sh
          sparse-checkout-cone-mode: false

      - name: Probe SSH paths (chroot)
        run: |
          set -euo pipefail
          chmod +x gitea-diagnostics/probe-relay-ssh.sh
          docker run --rm -i --privileged --pid=host --network=host \
            -v /:/host \
            viknow/ci-python:3.12-uv-docker29.1.3 \
            bash -c 'chroot /host bash -s' < gitea-diagnostics/probe-relay-ssh.sh
