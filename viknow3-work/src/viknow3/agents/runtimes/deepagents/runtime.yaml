# 多个 agent 共用的回合参数。
# 模型地址、密钥、数据库连接在 viknow_ops，不写在这里。
# 某个 agent 的工具、技能、提示词在 src/viknow3/agents/<agent>/profile。
recursion_limit: 999
skill_reminder:
  enabled: true
workspace:
  backend: bubblewrap
  virtual_mode: true
  max_file_size_mb: 25
  upload:
    max_file_mb: 25
    allowed_extensions: []
  parse:
    enabled: false
  staging:
    keep_uploads_cache: true
    purge_outputs_after_sync: true
    purge_scratch_after_run: true
sandbox:
  memory_limit_mb: 512
  max_pids: 256
  cpu_shares: 100
  timeout_seconds: 60
  max_output_bytes: 262144
  network_access: false
  gpu: false
model:
  temperature: 0.7
  repetition_penalty: 1.0
  max_input_tokens: 156000
  timeout_seconds: 600
