<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ViKnow Playground · 智能体</title>
    <link rel="stylesheet" href="/playground/assets/playground.css?v=9" />
  </head>
  <body class="pg-body">
    <div class="pg-shell">
      <aside class="pg-sidebar" aria-label="导航">
        <div class="pg-sidebar-head">
          <div class="pg-brand-mark">V</div>
          <div>
            <div class="pg-brand-title">ViKnow</div>
            <div class="pg-brand-sub">Playground</div>
          </div>
        </div>
        <nav class="pg-nav">
          <a class="pg-nav-item" href="/playground/workspace">知识库</a>
          <a class="pg-nav-item pg-nav-active" href="/playground/agents">智能体</a>
        </nav>
        <button id="btn-logout" class="pg-button-sidebar pg-sidebar-logout" type="button">退出登录</button>
      </aside>
      <main class="pg-main pg-workspace-fill">
        <div class="pg-main-inner">
          <header class="pg-header">
            <p class="pg-overline">Agents</p>
            <h1>智能体</h1>
            <p class="pg-muted"><code class="pg-mono">GET /api/v1/agent/agents</code> · <a href="http://36.103.198.236:5208/start/api/agents.html">API 文档</a></p>
          </header>
          <section class="pg-card">
            <h2>可用配置</h2>
            <div class="pg-card-body">
              <div id="agents-loading" class="pg-muted">加载中…</div>
              <ul id="agent-list" class="pg-list" hidden></ul>
              <p id="agent-list-empty" class="pg-muted" hidden>当前 app key 下没有可用智能体。</p>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="/playground/assets/runtime-config.js"></script>
    <script src="/playground/assets/api-base.js?v=1"></script>
    <script src="/playground/assets/user.js?v=8"></script>
    <script src="/playground/assets/agent.js?v=19"></script>
    <script>
      PlaygroundAgent.requireUser();
      document.getElementById("btn-logout").addEventListener("click", () => {
        localStorage.removeItem("viknow_playground_user");
        window.location.href = "/playground";
      });
      PlaygroundAgent.initAgentListPage();
    </script>
  </body>
</html>
