# Reverse proxy: Actio (236) → grant URLs on :5220 → 207 viknow-storage via SSH tunnel (127.0.0.1:15219).
# Upstream is substituted at container start from STORAGE_PROXY_UPSTREAM (default 127.0.0.1:15219).

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;

  server {
    listen 5220;
    server_name _;

    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    location / {
      proxy_pass http://STORAGE_PROXY_UPSTREAM;
    }
  }
}
