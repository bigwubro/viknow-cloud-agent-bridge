# =============================================================================
# ViKnow jinhe 客户现场 docker-compose.yml
# =============================================================================
# 由 236 上 viknow2-test（:5175）运行参数反推，适配「已有容器网络」部署。
#
# 236 viknow2-test 对照
#   镜像     viknow2-app:f396ab99e5e2          → ${VIKNOW_IMAGE}（交付 jinhe tag）
#   端口     5175:8000                         → ${VIKNOW_HOST_PORT:-8000}:8000
#   特权     privileged: true                  → 保留（JuiceFS 容器内 mount 需要）
#   数据卷   /data:/data                       → ${VIKNOW_DATA_DIR:-./data}:/data
#   状态卷   viknow2_test_state                → viknow_jinhe_state
#   cgroup   /sys/fs/cgroup:rw                 → 保留（与 viknow2-test 一致）
#   网络     token-gateway + extra_hosts       → external data 网络（容器名直连）
#   配置     config/test/app.yaml              → config/jinhe/app.yaml（镜像已 bake）
#   Langfuse / Token Gateway                  → jinhe 关闭（见 deploy.env）
#
# 使用前
#   1. data 栈（postgres/redis/minio/neo4j）已 up
#   2. export VIKNOW_DATA_NETWORK=<现场 data compose 网络名>
#   3. 编辑 deploy.env：服务名 + 密钥 + LiteLLM URL
#   4. docker load -i viknow2-app-*.tar && docker compose up -d
# =============================================================================

services:
  viknow2:
    image: ${VIKNOW_IMAGE:-viknow2-app:jinhe-51742-b497cc365b67}
    container_name: ${VIKNOW_CONTAINER_NAME:-viknow2-jinhe}
    restart: unless-stopped
    privileged: true
    ports:
      - "${VIKNOW_HOST_PORT:-8000}:8000"
    env_file:
      - ./deploy.env
    environment:
      PORT: "8000"
      VIKNOW_CONFIG: /opt/viknow/config/jinhe/app.yaml
    volumes:
      - ${VIKNOW_DATA_DIR:-./data}:/data
      - viknow_jinhe_state:/opt/viknow/.state
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      - data

networks:
  data:
    external: true
    name: ${VIKNOW_DATA_NETWORK:?set VIKNOW_DATA_NETWORK to your data stack network}

volumes:
  viknow_jinhe_state:
    name: ${VIKNOW_STATE_VOLUME:-viknow_jinhe_state}
