[project]
name = "viknow3"
version = "0.1.0"
description = "ViKnow access layer. One HTTP API per module, forwarding to that module's client."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "httpx>=0.27",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "deepagents>=0.7",
    "deepagents-sandbox[langchain]>=0.0.3",
    "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
