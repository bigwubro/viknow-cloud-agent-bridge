<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ViKnow Playground</title>
    <link rel="stylesheet" href="/playground/assets/playground.css?v=9" />
  </head>
  <body class="pg-body pg-auth">
    <div class="pg-shell">
      <header class="pg-topbar">
        <div class="pg-sidebar-head" style="padding: 0">
          <div class="pg-brand-mark">V</div>
          <div>
            <div class="pg-brand-title">ViKnow</div>
            <div class="pg-brand-sub">Playground</div>
          </div>
        </div>
        <p class="pg-topbar-note">Sign in</p>
      </header>
      <div class="pg-auth-main">
        <div class="pg-auth-panel">
          <header class="pg-header">
            <p class="pg-overline">Access · Users</p>
            <h1>开始使用</h1>
            <p class="pg-muted">创建终端用户或输入已有 ID。接口：<code class="pg-mono">POST /api/v1/users</code>、<code class="pg-mono">GET /api/v1/users/{id}</code>。</p>
          </header>

          <div class="pg-auth-grid">
            <section class="pg-card" aria-labelledby="create-heading">
              <h2 id="create-heading">创建用户</h2>
              <div class="pg-card-body">
                <label class="pg-label" for="display-name">显示名（可选）</label>
                <input id="display-name" class="pg-input" type="text" maxlength="200" placeholder="例如：张三" />
                <button id="btn-create" class="pg-button pg-button-primary" type="button">创建用户</button>
                <div id="create-result" class="pg-result" hidden></div>
              </div>
            </section>

            <section class="pg-card" aria-labelledby="login-heading">
              <h2 id="login-heading">进入工作区</h2>
              <div class="pg-card-body">
                <form id="login-form">
                  <label class="pg-label" for="user-id">用户 ID</label>
                  <input
                    id="user-id"
                    class="pg-input pg-mono"
                    name="user_id"
                    required
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="创建成功后自动填入，或粘贴已有 UUID"
                  />
                  <button class="pg-button pg-button-primary pg-full" type="submit">继续</button>
                </form>
                <p id="login-error" class="pg-error" role="alert" hidden></p>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
    <script src="/playground/assets/user.js?v=7"></script>
  </body>
</html>
