worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx-pd.pid;
events { worker_connections 4096; }
http {
  access_log /var/log/nginx/access.log;
  proxy_http_version 1.1;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  proxy_connect_timeout 10s;
  client_max_body_size 32m;
  upstream pd_pairs {
    least_conn;
    server 127.0.0.1:8520;
    server 127.0.0.1:8521;
  }
  server {
    listen 127.0.0.1:8500;
    location /v1/chat/completions { proxy_pass http://pd_pairs; }
    location /v1/completions { proxy_pass http://pd_pairs; }
    location /health { proxy_pass http://pd_pairs; }
    location / {
      proxy_pass http://127.0.0.1:8510;
    }
  }
}
