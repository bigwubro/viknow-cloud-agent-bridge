# Copy to: castmeta-research/viknow2/.gitea/workflows/diagnose-236-ssh.yml
# Gitea → Actions → Diagnose 236 SSH → Run workflow

name: Diagnose 236 SSH

on:
  workflow_dispatch:
    inputs:
      ssh_user:
        description: SSH user to inspect authorized_keys
        required: false
        default: cursor-agent

jobs:
  diagnose-236-ssh:
    name: Diagnose Cloud Agent SSH to 236
    runs-on: python-312-uv

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            gitea-diagnostics/diagnose-236-ssh.sh
          sparse-checkout-cone-mode: false

      - name: Run SSH diagnostics on host (chroot)
        env:
          DIAG_SSH_USER: ${{ inputs.ssh_user }}
        run: |
          set -euo pipefail
          chmod +x gitea-diagnostics/diagnose-236-ssh.sh
          install -m 755 gitea-diagnostics/diagnose-236-ssh.sh /tmp/diagnose-236-ssh.sh
          # CI job runs inside a container; chroot into host rootfs for real sshd/keys/logs.
          docker run --rm --privileged --pid=host --network=host \
            -v /:/host \
            -v /tmp/diagnose-236-ssh.sh:/host/tmp/diagnose-236-ssh.sh:ro \
            -e DIAG_SSH_USER="${DIAG_SSH_USER}" \
            viknow/ci-python:3.12-uv-docker29.1.3 \
            bash -c 'chroot /host env DIAG_SSH_USER="${DIAG_SSH_USER}" bash /tmp/diagnose-236-ssh.sh'
