# 236 手工冒烟：连接方式对齐 viknow2-test（host.docker.internal + 172.30.57.94）
# 与 docker-compose.yml 同目录；deploy.env 用 deploy.env.236 复制为 deploy.env。
#
# 前置：viknow-test-data 四件套已 up（宿主机映射 15432/16379/19000/17687）

services:
  viknow2:
    image: ${VIKNOW_IMAGE:-viknow2-app:56d8705e5feb}
    container_name: ${VIKNOW_CONTAINER_NAME:-viknow2-jinhe-manual}
    restart: unless-stopped
    privileged: true
    ports:
      - "${VIKNOW_HOST_PORT:-8006}:8000"
    env_file:
      - ./deploy.env
    environment:
      PORT: "8000"
      VIKNOW_CONFIG: /opt/viknow/config/jinhe/app.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${VIKNOW_DATA_DIR:-./data}:/data
      - viknow_jinhe_state:/opt/viknow/.state
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

volumes:
  viknow_jinhe_state:
    name: ${VIKNOW_STATE_VOLUME:-viknow_jinhe_manual_state}
